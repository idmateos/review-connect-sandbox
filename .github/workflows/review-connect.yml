# Review Connect: publishes the review branch chosen in Review Connect.
# Other pushes skip the publish job. No secrets needed.
name: Review Connect
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
env:
  REVIEW_CONNECT_URL: https://review.igordiaz.com
  REVIEW_CONNECT_SITE: d6e2d457-520f-407d-b618-d4a4960e546f
jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    outputs:
      publish: ${{ steps.rc.outputs.publish }}
    steps:
      - id: rc
        run: |
          curl -fsSL "$REVIEW_CONNECT_URL/cli/review-connect.mjs" -o "$RUNNER_TEMP/review-connect.mjs"
          node "$RUNNER_TEMP/review-connect.mjs" check
  publish:
    needs: check
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: review-connect-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/configure-pages@v5
      - run: node build.mjs
      - name: Review Connect · prepare
        run: |
          curl -fsSL "$REVIEW_CONNECT_URL/cli/review-connect.mjs" -o "$RUNNER_TEMP/review-connect.mjs"
          node "$RUNNER_TEMP/review-connect.mjs" prepare --html-dir dist
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
      - name: Review Connect · publish
        run: node "$RUNNER_TEMP/review-connect.mjs" publish
