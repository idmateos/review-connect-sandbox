name: Publish a review version
on:
  push:
    tags: ['review/**']
  workflow_dispatch:
    inputs:
      request_review:
        description: Avisar a los revisores al terminar
        type: boolean
        default: true
      summary:
        description: Resumen de cambios para los revisores
        type: string
        default: Nueva versión preparada para revisión
permissions:
  contents: read
concurrency:
  group: review-staging
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      RC_API_URL: ${{ vars.RC_API_URL }}
      RC_PROJECT_ID: ${{ vars.RC_PROJECT_ID }}
      RC_TARGET_ID: ${{ vars.RC_TARGET_ID }}
      RC_PUBLICATION_URL: ${{ vars.RC_PUBLICATION_URL }}
      RC_VERSION_LABEL: ${{ github.ref_name }}
      RC_HTML_DIR: dist
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/configure-pages@v5
      - run: node build.mjs
      - name: Prepare immutable version and insert Review Connect
        env:
          RC_DEPLOY_TOKEN: ${{ secrets.RC_DEPLOY_TOKEN }}
        run: |
          node tools/review-connect.mjs prepare \
            --project-id "$RC_PROJECT_ID" --target-id "$RC_TARGET_ID" \
            --build-id "$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --commit-sha "$GITHUB_SHA" --version-label "$RC_VERSION_LABEL" \
            --url "$RC_PUBLICATION_URL" \
            --publication-key "$GITHUB_REPOSITORY:$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT" \
            --html-dir "$RC_HTML_DIR" --out review-release.json
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ env.RC_HTML_DIR }}
      - name: Publish prepared artifact
        id: deploy
        uses: actions/deploy-pages@v4
      - name: Confirm successful publication in Review Connect
        env:
          RC_DEPLOY_TOKEN: ${{ secrets.RC_DEPLOY_TOKEN }}
        run: node tools/review-connect.mjs activate --manifest review-release.json
      - name: Mark ready and notify configured reviewers
        if: github.event_name == 'push' || inputs.request_review
        env:
          RC_DEPLOY_TOKEN: ${{ secrets.RC_DEPLOY_TOKEN }}
          RC_REVIEW_SUMMARY: ${{ inputs.summary || 'Nueva versión preparada para revisión' }}
        run: node tools/review-connect.mjs ready --manifest review-release.json --summary "$RC_REVIEW_SUMMARY"
